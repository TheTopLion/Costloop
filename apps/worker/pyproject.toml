[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appraise-worker"
version = "0.1.0"
description = "Background processing service for Appraise"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "openpyxl>=3.1,<4",
  "xlsxwriter>=3.2,<4",
  "rapidfuzz>=3.10,<4",
  "xlrd>=2.0,<3",
  "pdfplumber>=0.11,<1",
  "uvicorn>=0.34,<1"
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "reportlab>=4.2,<5", "ruff>=0.9,<1"]
anthropic = ["anthropic>=0.49,<1", "instructor>=1.7,<2"]
embeddings = ["sentence-transformers>=3.0,<4"]

[tool.hatch.build.targets.wheel]
packages = ["appraise_worker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
